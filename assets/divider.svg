<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 44" width="1200" height="44" role="img" aria-label="">
<defs>
<linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#6F5FA8" stop-opacity="0"/>
<stop offset="22%" stop-color="#6F5FA8" stop-opacity="0.45"/>
<stop offset="44%" stop-color="#6F5FA8" stop-opacity="0.05"/>
<stop offset="56%" stop-color="#6F5FA8" stop-opacity="0.05"/>
<stop offset="78%" stop-color="#6F5FA8" stop-opacity="0.45"/>
<stop offset="100%" stop-color="#6F5FA8" stop-opacity="0"/>
</linearGradient>
<radialGradient id="halo" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#B9A7E8" stop-opacity="0.20"/>
<stop offset="60%" stop-color="#B9A7E8" stop-opacity="0.05"/>
<stop offset="100%" stop-color="#B9A7E8" stop-opacity="0"/>
</radialGradient>
<mask id="crescent">
<circle cx="600" cy="22" r="11" fill="#fff"/>
<circle cx="607" cy="18" r="10" fill="#000"/>
</mask>
<style>
/* geometry untouched. animation only: the halo breathes, the stars
   twinkle to their own set opacity so the original weighting holds. */
@keyframes halo { 0%,100%{opacity:.55} 50%{opacity:1} }
@keyframes tw75 { 0%,100%{opacity:.30} 50%{opacity:.75} }
@keyframes tw50 { 0%,100%{opacity:.18} 50%{opacity:.50} }
@keyframes tw35 { 0%,100%{opacity:.12} 50%{opacity:.35} }
@keyframes tw45 { 0%,100%{opacity:.16} 50%{opacity:.45} }
.halo{ animation: halo 7s ease-in-out infinite }
.a { animation: tw75 5s   ease-in-out infinite }
.b { animation: tw50 6.2s ease-in-out infinite }
.c { animation: tw35 7s   ease-in-out infinite }
.d { animation: tw45 5.6s ease-in-out infinite }
.s2{ animation-delay:-2.6s } .s3{ animation-delay:-0.8s }
.s4{ animation-delay:-1.9s } .s5{ animation-delay:-3.8s }
.s6{ animation-delay:-2.1s } .s7{ animation-delay:-3.4s }
.s8{ animation-delay:-1.2s }
@media (prefers-reduced-motion: reduce){
  .halo,.a,.b,.c,.d{ animation:none }
}
</style>
</defs>

<line x1="0" y1="22" x2="1200" y2="22" stroke="url(#rule)" stroke-width="1"/>

<circle class="halo" cx="600" cy="22" r="26" fill="url(#halo)"/>
<circle cx="600" cy="22" r="11" fill="#B9A7E8" opacity="0.9" mask="url(#crescent)"/>

<g fill="#C9BCEB">
<circle class="a"    cx="556" cy="15" r="1.6" opacity="0.75"/>
<circle class="b s6" cx="534" cy="27" r="1.2" opacity="0.5"/>
<circle class="c s7" cx="508" cy="19" r="1"   opacity="0.35"/>
<circle class="d s8" cx="574" cy="32" r="1.1" opacity="0.45"/>
<circle class="a s2" cx="644" cy="28" r="1.6" opacity="0.75"/>
<circle class="b s3" cx="666" cy="16" r="1.2" opacity="0.5"/>
<circle class="c s4" cx="692" cy="25" r="1"   opacity="0.35"/>
<circle class="d s5" cx="626" cy="11" r="1.1" opacity="0.45"/>
</g>
</svg>
